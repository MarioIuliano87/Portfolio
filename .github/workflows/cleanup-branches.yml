name: Cleanup stale branches

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup stale branches
        uses: Balvajs/delete-stale-branches@v2.1.1
        with:
          days-to-delete: 5
          dry-run: true
